<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>
        body {
            background: #eef2f7;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            color: #2563eb;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Add New Student</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="email" name="email"
               placeholder="Email Address" required>

        <input type="number" name="age"
               placeholder="Age" required>

        <input type="text" name="course"
               placeholder="Course" required>

        <button type="submit">Save Student</button>
    </form>

    <a href="/">Back to Home</a>

</div>

</body>
</html>
