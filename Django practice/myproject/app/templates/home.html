<!DOCTYPE html>
<html>
<head>
    <title>Vishitha - Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 85%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .project-name {
            text-align: center;
            color: #333;
            font-size: 25px;
            margin-bottom: 35px;
        }

        .add-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #eff6ff;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        .empty-message {
            color: #777;
            padding: 20px;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- Main Heading -->

    <h1>Welcome to Django Project</h1>

    <h2 class="project-name">
        Student Management System
    </h2>

    <!-- Add Student Button -->

    <a href="{% url 'add_student' %}" class="add-btn">
        + Add Student
    </a>

    <!-- Student Details -->

    <h2>Student List</h2>

    <table>

        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.name }}</td>

            <td>{{ student.email }}</td>

            <td>{{ student.age }}</td>

            <td>{{ student.course }}</td>

            <!-- Delete Button -->

            <td>
                <form method="POST"
                      action="{% url 'delete_student' student.id %}"
                      onsubmit="return confirm('Are you sure you want to delete this student?');">

                    {% csrf_token %}

                    <button type="submit" class="delete-btn">
                        Delete
                    </button>

                </form>
            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="5" class="empty-message">
                No students added yet.
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
